<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>HeadBallAbdulla</title>

		<style>

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #000000;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}


/* =========================================
   FULLSCREEN BUTTON SCREEN
   ========================================= */

#fullscreen-screen {
	position: fixed;
	inset: 0;

	background: #000000;

	z-index: 9999;

	display: flex;

	justify-content: center;
	align-items: center;
}


#fullscreen-btn {
	padding: 16px 28px;

	font-size: 20px;
	font-weight: bold;

	background: white;
	color: black;

	border: none;
	border-radius: 12px;

	cursor: pointer;
}


/* =========================================
   FAKE LOADING SCREEN
   ========================================= */

#fake-loading {
	position: fixed;
	inset: 0;

	background: #000000;

	z-index: 9998;

	display: none;

	flex-direction: column;

	justify-content: center;
	align-items: center;

	font-family: Arial, sans-serif;
}


/* Loading text */

#loading-text {
	font-size: 24px;
	font-weight: bold;

	margin-bottom: 20px;
}


/* Loading bar background */

#loading-bar-container {
	width: 70%;
	max-width: 500px;

	height: 18px;

	background: #333333;

	border-radius: 20px;

	overflow: hidden;
}


/* Loading bar */

#loading-bar {
	width: 0%;

	height: 100%;

	background: white;

	transition: width 0.1s linear;
}


/* Percentage */

#loading-percent {
	margin-top: 12px;

	font-size: 18px;
}

		</style>


		<link id="-gd-engine-icon"
			type="image/png"
			rel="icon"
			href="index.icon.png" />

		<link rel="apple-touch-icon"
			href="index.apple-touch-icon.png"/>

		<!-- Vercel Web Analytics -->
		<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>

	</head>


	<body>


		<!-- =====================================
		     BLACK FULLSCREEN BUTTON SCREEN
		     ===================================== -->

		<div id="fullscreen-screen">

			<button id="fullscreen-btn">
				Fullscreen
			</button>

		</div>


		<!-- =====================================
		     FAKE 30 SECOND LOADING SCREEN
		     ===================================== -->

		<div id="fake-loading">

			<div id="loading-text">
				Loading...
			</div>


			<div id="loading-bar-container">

				<div id="loading-bar"></div>

			</div>


			<div id="loading-percent">
				0%
			</div>

		</div>


		<!-- =====================================
		     GODOT CANVAS
		     ===================================== -->

		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>


		<noscript>
			Your browser does not support JavaScript.
		</noscript>


		<!-- =====================================
		     GODOT STATUS
		     ===================================== -->

		<div id="status">

			<img
				id="status-splash"
				class="show-image--true fullsize--true use-filter--true"
				src="index.png"
				alt=""
			>

			<progress id="status-progress"></progress>

			<div id="status-notice"></div>

		</div>


		<!-- =====================================
		     GODOT ENGINE
		     ===================================== -->

		<script src="index.js"></script>


		<script>

const GODOT_CONFIG = {
	"args": [],
	"canvasResizePolicy": 2,
	"emscriptenPoolSize": 8,
	"ensureCrossOriginIsolationHeaders": true,
	"executable": "index",
	"experimentalVK": false,
	"fileSizes": {
		"index.pck": 17014228,
		"index.wasm": 39514754
	},
	"focusCanvas": true,
	"gdextensionLibs": [],
	"godotPoolSize": 4
};


const GODOT_THREADS_ENABLED = false;


const engine = new Engine(GODOT_CONFIG);


(function () {

	const statusOverlay =
		document.getElementById('status');

	const statusProgress =
		document.getElementById('status-progress');

	const statusNotice =
		document.getElementById('status-notice');


	let initializing = true;

	let statusMode = '';


	function setStatusMode(mode) {

		if (
			statusMode === mode ||
			!initializing
		) {
			return;
		}


		if (mode === 'hidden') {

			statusOverlay.remove();

			initializing = false;

			return;
		}


		statusOverlay.style.visibility =
			'visible';


		statusProgress.style.display =
			mode === 'progress'
				? 'block'
				: 'none';


		statusNotice.style.display =
			mode === 'notice'
				? 'block'
				: 'none';


		statusMode = mode;
	}


	function setStatusNotice(text) {

		while (statusNotice.lastChild) {

			statusNotice.removeChild(
				statusNotice.lastChild
			);

		}


		const lines =
			text.split('\n');


		lines.forEach((line) => {

			statusNotice.appendChild(
				document.createTextNode(line)
			);


			statusNotice.appendChild(
				document.createElement('br')
			);

		});
	}


	function displayFailureNotice(err) {

		console.error(err);


		if (err instanceof Error) {

			setStatusNotice(
				err.message
			);

		}

		else if (typeof err === 'string') {

			setStatusNotice(
				err
			);

		}

		else {

			setStatusNotice(
				'An unknown error occurred.'
			);

		}


		setStatusMode('notice');

		initializing = false;
	}


	const missing =
		Engine.getMissingFeatures({
			threads:
				GODOT_THREADS_ENABLED,
		});


	if (missing.length !== 0) {


		if (
			GODOT_CONFIG['serviceWorker'] &&
			GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] &&
			'serviceWorker' in navigator
		) {


			let serviceWorkerRegistrationPromise;


			try {

				serviceWorkerRegistrationPromise =
					navigator.serviceWorker.getRegistration();

			}

			catch (err) {

				serviceWorkerRegistrationPromise =
					Promise.reject(
						new Error(
							'Service worker registration failed.'
						)
					);

			}


			Promise.race([


				serviceWorkerRegistrationPromise
					.then((registration) => {

						if (registration != null) {

							return Promise.reject(
								new Error(
									'Service worker already exists.'
								)
							);

						}

						return registration;

					})

					.then(() =>
						engine.installServiceWorker()
					),


				new Promise((resolve) => {

					setTimeout(
						() => resolve(),
						2000
					);

				}),


			])

			.then(() => {

				window.location.reload();

			})

			.catch((err) => {

				console.error(
					'Error while registering service worker:',
					err
				);

			});


		}

		else {


			const missingMsg =
				'Error\nThe following features required to run Godot projects on the Web are missing:\n';


			displayFailureNotice(
				missingMsg +
				missing.join('\n')
			);

		}


	}

	else {


		setStatusMode('progress');


		engine.startGame({

			'onProgress':
				function (current, total) {


					if (
						current > 0 &&
						total > 0
					) {

						statusProgress.value =
							current;

						statusProgress.max =
							total;

					}

					else {

						statusProgress
							.removeAttribute(
								'value'
							);

						statusProgress
							.removeAttribute(
								'max'
							);

					}

				},

		})


		.then(() => {

			setStatusMode('hidden');

		}, displayFailureNotice);

	}

}());

		</script>


		<!-- =====================================
		     FULLSCREEN + FAKE LOADING
		     ===================================== -->

		<script>

const fullscreenScreen =
	document.getElementById(
		"fullscreen-screen"
	);


const fullscreenButton =
	document.getElementById(
		"fullscreen-btn"
	);


const fakeLoading =
	document.getElementById(
		"fake-loading"
	);


const loadingBar =
	document.getElementById(
		"loading-bar"
	);


const loadingPercent =
	document.getElementById(
		"loading-percent"
	);


/*
 * Fullscreen button clicked
 */

fullscreenButton.addEventListener(
	"click",
	async () => {

		try {


			/*
			 * Enter fullscreen
			 */

			await document.documentElement
				.requestFullscreen();


			/*
			 * Remove black fullscreen
			 * button screen
			 */

			fullscreenScreen.style.display =
				"none";


			/*
			 * Show fake loading
			 */

			fakeLoading.style.display =
				"flex";


			/*
			 * 30 SECOND TIMER
			 */

			const duration =
				30000;


			const startTime =
				Date.now();


			const loadingInterval =
				setInterval(() => {


					const elapsed =
						Date.now() -
						startTime;


					let progress =
						(elapsed / duration) *
						100;


					if (progress > 100) {

						progress = 100;

					}


					/*
					 * Update loading bar
					 */

					loadingBar.style.width =
						progress + "%";


					/*
					 * Update percentage
					 */

					loadingPercent.textContent =
						Math.floor(progress) + "%";


					/*
					 * Finished
					 */

					if (progress >= 100) {


						clearInterval(
							loadingInterval
						);


						/*
						 * Hide fake loading
						 */

						fakeLoading.style.display =
							"none";

					}


				}, 50);


		}

		catch (error) {


			console.error(
				"Fullscreen failed:",
				error
			);

		}

	}
);

		</script>


	</body>
</html>
